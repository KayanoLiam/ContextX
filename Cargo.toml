[package]
name = "contextX"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "2.2.0", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.2"
dotenvy = "0.15"
